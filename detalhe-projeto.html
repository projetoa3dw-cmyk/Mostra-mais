<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra+ | Detalhes do Projeto</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .custom-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
    }

    .image-modal-content {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 0.75rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      color: #FFFFFF;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: Arial, sans-serif;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.7);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      line-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
      user-select: none;
    }

    .modal-close-btn:hover {
      background: #EF4444;
      transform: scale(1.05);
    }

    .thumb-hover {
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .thumb-hover:hover {
      transform: scale(1.02);
      border-color: var(--una-primary, #6A005B) !important;
    }

    .info-card {
      background: #FFF;
      border: 1px solid var(--border-color, #E2E8F0);
      border-radius: 0.85rem;
      padding: 1.2rem;
      margin-bottom: 1rem;
    }

    .author-card-clickable {
      background: var(--una-light, #FDF0F5);
      border: 1px solid var(--una-border-pink, #F3D3E0);
      border-radius: 0.85rem;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .author-card-clickable:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(106, 0, 91, 0.08);
    }

    .author-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--una-primary, #6A005B);
      background: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--una-primary, #6A005B);
      font-size: 1.1rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .social-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      text-decoration: none;
      background: var(--una-light, #FDF0F5);
      color: var(--una-primary, #6A005B);
      border: 1px solid var(--una-border-pink, #F3D3E0);
    }

    
  
  </style>
</head>
<body>

  <div class="mobile-container">
    <header class="header-sticky">
      <a href="index.html" class="brand-logo">Mostra<span>+</span></a>
      <a href="javascript:void(0)" onclick="voltarParaVitrine()" style="font-size: 0.75rem; color: var(--una-primary); text-decoration: none; font-weight: 600;">← Voltar à Vitrine</a>
    </header>

    <main style="padding: 1.25rem 1rem;" id="detalhe-container">
      <!-- Preenchido via JS -->
    </main>
  </div>

  <div id="modal-zoom" class="custom-modal" onclick="fecharModalZoom(event)">
    <span class="modal-close-btn" onclick="fecharModalZoomDirect()">✕</span>
    <img id="img-modal-target" class="image-modal-content" src="" alt="Imagem Ampliada">
  </div>

  <div id="modal-perfil-autor" class="custom-modal" onclick="fecharModalPerfil(event)">
    <div style="background: #FFF; border-radius: 1rem; padding: 1.5rem; width: 100%; max-width: 380px; position: relative; border: 1px solid var(--una-border-pink, #F3D3E0); text-align: center;">
      <span class="modal-close-btn" style="top: 0.75rem; right: 0.75rem; color: #333; background: #F1F5F9; border-color: #CBD5E1;" onclick="fecharModalPerfilDirect()">✕</span>
      
      <div id="author-modal-avatar" class="author-avatar" style="width: 80px; height: 80px; font-size: 1.8rem; margin: 0 auto 0.75rem auto;"></div>
      
      <h3 id="author-modal-nome" style="font-size: 1.15rem; font-weight: 800; color: var(--una-vinho, #3B0033); margin-bottom: 0.1rem;">Nome do Aluno</h3>
      
      <span id="author-modal-curso" class="badge-tag" style="background: #E0F2FE; color: #0369A1; border-color: #BAE6FD; margin-bottom: 1rem; display: inline-block; white-space: normal; text-align: center; max-width: 100%; word-break: break-word;">
        Curso de Graduação
      </span>

      <div style="text-align: left; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
        <strong style="font-size: 0.8rem; color: var(--una-vinho);">Sobre / Biografia:</strong>
        <p id="author-modal-bio" style="font-size: 0.78rem; color: #444; margin-top: 0.3rem; line-height: 1.4;">
          Nenhuma biografia informada.
        </p>
      </div>

      <div style="margin-top: 1rem;">
        <strong style="font-size: 0.8rem; color: var(--una-vinho); display: block; margin-bottom: 0.5rem;">Redes & Links Profissionais:</strong>
        <div id="author-modal-redes" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem;"></div>
      </div>
    </div>
  </div>

  <button id="btnTopo" class="btn-voltar-topo" onclick="voltarAoTopo()" title="Voltar ao topo">↑</button>

  <script>
    let dadosPublicadorAtual = null;
    let imagensGaleriaAtual = [];
    let projetoIdAtual = null;

    document.addEventListener('DOMContentLoaded', () => {
      carregarDetalhesProjeto();

      window.addEventListener('scroll', () => {
        const btnTopo = document.getElementById('btnTopo');
        if (window.scrollY > 300) {
          btnTopo.style.display = 'flex';
        } else {
          btnTopo.style.display = 'none';
        }
      });
    });

    

    function voltarParaVitrine() {
      const params = new URLSearchParams(window.location.search);
      const paginaAnterior = params.get('pag');
      if (paginaAnterior !== null) {
        localStorage.setItem('ultimaPaginaVitrine_MostraPlus', paginaAnterior);
      }
      window.location.href = 'index.html';
    }

    function abrirModalZoom(src) {
      if (!src) return;
      const modal = document.getElementById('modal-zoom');
      const target = document.getElementById('img-modal-target');
      target.src = src;
      modal.style.display = 'flex';
    }

    function fecharModalZoom(event) {
      if (event.target.id === 'modal-zoom') {
        document.getElementById('modal-zoom').style.display = 'none';
      }
    }

    function fecharModalZoomDirect() {
      document.getElementById('modal-zoom').style.display = 'none';
    }

    function abrirModalPerfil() {
      if (!dadosPublicadorAtual) return;
      const avatarDiv = document.getElementById('author-modal-avatar');
      if (dadosPublicadorAtual.foto && dadosPublicadorAtual.foto.trim() !== '') {
        avatarDiv.innerHTML = `<img src="${dadosPublicadorAtual.foto}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.parentElement.innerHTML='${dadosPublicadorAtual.iniciais}'" />`;
      } else {
        avatarDiv.innerHTML = dadosPublicadorAtual.iniciais;
      }
      document.getElementById('author-modal-nome').textContent = dadosPublicadorAtual.nome;
      document.getElementById('author-modal-curso').textContent = dadosPublicadorAtual.curso ? `📚 ${dadosPublicadorAtual.curso}` : 'Estudante Acadêmico';
      document.getElementById('author-modal-bio').textContent = dadosPublicadorAtual.bio || 'Nenhuma biografia informada.';

      const redesContainer = document.getElementById('author-modal-redes');
      let htmlRedes = '';
      if (dadosPublicadorAtual.linkedin) htmlRedes += `<a href="${dadosPublicadorAtual.linkedin}" target="_blank" class="social-badge">LinkedIn ↗</a>`;
      if (dadosPublicadorAtual.github) htmlRedes += `<a href="${dadosPublicadorAtual.github}" target="_blank" class="social-badge">GitHub ↗</a>`;
      if (dadosPublicadorAtual.portfolio) htmlRedes += `<a href="${dadosPublicadorAtual.portfolio}" target="_blank" class="social-badge">Portfólio ↗</a>`;
      if (!htmlRedes) htmlRedes = `<p style="font-size: 0.72rem; color: var(--text-muted);">Nenhum link adicionado.</p>`;
      redesContainer.innerHTML = htmlRedes;

      document.getElementById('modal-perfil-autor').style.display = 'flex';
    }

    function fecharModalPerfil(event) {
      if (event.target.id === 'modal-perfil-autor') {
        document.getElementById('modal-perfil-autor').style.display = 'none';
      }
    }

    function fecharModalPerfilDirect() {
      document.getElementById('modal-perfil-autor').style.display = 'none';
    }

    function extrairUrlImagem(item) {
      if (!item) return '';
      if (typeof item === 'string') return item.trim();
      if (typeof item === 'object') {
        if (item.url && typeof item.url === 'string') return item.url.trim();
        if (item.src && typeof item.src === 'string') return item.src.trim();
        if (item.base64 && typeof item.base64 === 'string') return item.base64.trim();
      }
      return '';
    }

    function carregarDetalhesProjeto() {
      const params = new URLSearchParams(window.location.search);
      const idProjeto = params.get('id');
      const paginaOriginal = params.get('pag');
      if (paginaOriginal !== null) localStorage.setItem('ultimaPaginaVitrine_MostraPlus', paginaOriginal);

      projetoIdAtual = idProjeto;
      const container = document.getElementById('detalhe-container');
      let listaProjetos = JSON.parse(localStorage.getItem('projetosMostraPlus')) || [];
      const contas = JSON.parse(localStorage.getItem('contasMostraPlus')) || [];

      const indexProjeto = listaProjetos.findIndex(p => String(p.id) === String(idProjeto));

      if (!idProjeto || indexProjeto === -1) {
        container.innerHTML = `<div style="text-align: center; padding: 3rem 1rem;"><p>Projeto não encontrado!</p><a href="javascript:void(0)" onclick="voltarParaVitrine()" class="btn-submit" style="display:inline-block; margin-top:1rem; text-decoration:none;">Voltar à Vitrine</a></div>`;
        return;
      }

      let projeto = listaProjetos[indexProjeto];

      let projetosVistosMaquina = JSON.parse(localStorage.getItem('projetosVistos_MostraPlus')) || [];
      if (!projetosVistosMaquina.includes(String(projeto.id))) {
        projeto.acessos = (projeto.acessos || 0) + 1;
        listaProjetos[indexProjeto] = projeto;
        localStorage.setItem('projetosMostraPlus', JSON.stringify(listaProjetos));
        projetosVistosMaquina.push(String(projeto.id));
        localStorage.setItem('projetosVistos_MostraPlus', JSON.stringify(projetosVistosMaquina));
      }

      let contaPublicador = projeto.emailContato ? contas.find(c => c.email && c.email.toLowerCase() === projeto.emailContato.toLowerCase()) : null;
      const nomePublicador = contaPublicador?.nome || projeto.participantes || 'Estudante';
      const cursoPublicador = contaPublicador?.curso || 'Engenharia de Software';
      const emailPublicador = projeto.emailContato || contaPublicador?.email || 'E-mail não informado';
      const fotoPublicador = contaPublicador?.foto || '';
      const iniciaisPublicador = nomePublicador.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'AL';

      dadosPublicadorAtual = { nome: nomePublicador, curso: cursoPublicador, foto: fotoPublicador, iniciais: iniciaisPublicador, bio: contaPublicador?.bio || '', linkedin: contaPublicador?.linkedin || '', github: contaPublicador?.github || '', portfolio: contaPublicador?.portfolio || '' };

      const avatarHtml = (fotoPublicador && fotoPublicador.trim() !== '')
        ? `<img src="${fotoPublicador}" class="author-avatar" onerror="this.outerHTML='<div class=\'author-avatar\'>${iniciaisPublicador}</div>'" />`
        : `<div class="author-avatar">${iniciaisPublicador}</div>`;

      const logoUrl = extrairUrlImagem(projeto.logo);
      const capaHtml = logoUrl ? `<div style="width: 100%; height: 260px; background: #FAFAFA; border: 1px solid var(--border-color); border-radius: 0.85rem; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 1rem; padding: 0.5rem;"><img src="${logoUrl}" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.parentElement.style.display='none'" /></div>` : '';

      let rawGaleria = projeto.imagensDetalhadas || projeto.galeria || projeto.imagens || [];
      let imagensValidas = [];

      if (Array.isArray(rawGaleria)) {
        rawGaleria.forEach(item => {
          let url = extrairUrlImagem(item);
          if (url) imagensValidas.push(url);
        });
      }

      imagensGaleriaAtual = imagensValidas;

      let galeriaHtml = '';
      if (imagensValidas.length > 0) {
        galeriaHtml = `
          <div class="info-card">
            <strong style="font-size: 0.85rem; color: var(--una-vinho); display: block; margin-bottom: 0.6rem;">Galeria de Imagens (${imagensValidas.length})</strong>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem;">
              ${imagensValidas.map((url, index) => `
                <div class="thumb-hover" onclick="abrirModalZoom(imagensGaleriaAtual[\${index}])" style="height: 85px; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden; background: #FAFAFA; display: flex; align-items: center; justify-content: center; padding: 0.2rem;">
                  <img src="${url}" alt="Imagem ${index + 1} da galeria" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none'" />
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <span class="badge-tag">${projeto.categoria || 'Geral'}</span>
         
        </div>
        
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--una-vinho); margin-bottom: 0.75rem;">${projeto.titulo}</h1>
        
        <div class="author-card-clickable" onclick="abrirModalPerfil()">
          ${avatarHtml}
          <div>
            <span style="font-size: 0.65rem; font-weight: 700; color: var(--una-primary); text-transform: uppercase;">PUBLICADO POR:</span>
            <h3 style="font-size: 0.95rem; font-weight: 800; color: var(--una-vinho); margin-top: 0.1rem;">${nomePublicador}</h3>
            <p style="font-size: 0.75rem; color: #555; margin-top: 0.1rem;">📚 ${cursoPublicador}</p>
            <p style="font-size: 0.72rem; color: #666; margin-top: 0.1rem;">✉️ ${emailPublicador}</p>
          </div>
        </div>

        ${capaHtml}

        <div class="info-card">
          <strong style="font-size: 0.85rem; color: var(--una-vinho); display: block; margin-bottom: 0.3rem;">Alunos:</strong>
          <p style="font-size: 0.85rem; font-weight: 800; color: #1E293B; margin-bottom: 1rem;">${projeto.participantes || nomePublicador}</p>
          
          <strong style="font-size: 0.85rem; color: var(--una-vinho); display: block; margin-bottom: 0.3rem;">Descrição:</strong>
          <p style="font-size: 0.82rem; line-height: 1.5; color: #334155;">${projeto.descricao}</p>
        </div>

        ${galeriaHtml}

        ${projeto.linkSite ? `<a href="\${projeto.linkSite}" target="_blank" class="btn-submit" style="display: block; text-align: center; text-decoration: none; margin-top: 1.25rem; margin-bottom: 1.25rem;">Ver Projeto / Repositório ↗</a>` : ''}
      `;
    }
  </script>
</body>
</html>
